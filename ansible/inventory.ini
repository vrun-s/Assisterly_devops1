# ==============================================================================
# Assisterly Ansible Deployment Inventory
# Example targets: local machine, WSL, or remote staging/production server.
# ==============================================================================

[local]
localhost ansible_connection=local

[staging]
# Replace with actual target hostname or IP when deploying remotely
# staging-server.internal ansible_host=192.168.1.50 ansible_user=deploy

[production]
# Replace with production target hostname or IP
# prod-server.internal ansible_host=192.168.1.100 ansible_user=deploy

[all:vars]
ansible_python_interpreter=/usr/bin/python3
app_name=assisterly
app_image=assisterly:latest
container_name=assisterly-app
app_port=5000
data_dir=/var/lib/assisterly/data
health_check_url=http://localhost:5000/api/health
max_health_retries=10
health_retry_delay=3
