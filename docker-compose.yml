services:
  assisterly-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: assisterly-app
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      - DATABASE_PATH=/app/data/assisterly.db
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-assisterly-lab-secret-key-23IT721}
    volumes:
      - assisterly_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  assisterly_data:
    name: assisterly_data
    driver: local
